name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet flet-builder fdocx openpyxl python-pptx

    - name: Build IPA with Flet
      run: |
        # Команда для збірки iOS додатку (потребує налаштованого середовища)
        flet pack main.py --platforms ios
